spring.application.name=hospitalManagement

#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/hospitalDB
spring.datasource.username=postgres
spring.datasource.password=nand123

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# either the below property or @BatchSize(size=3) in the entity association field will result in batch fetching
#this will result in fewer select query still lazy loading.
spring.jpa.properties.hibernate.default_batch_fetch_size=3